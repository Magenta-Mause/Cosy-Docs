name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'argo/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update deployment manifest with new image
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          sed -i -E "s|( *image: )\S+|\1${IMAGE}:${TAG}|" argo/deployment.yaml
          grep -q "${IMAGE}:${TAG}" argo/deployment.yaml

          if git diff --quiet -- argo/deployment.yaml; then
            echo "Manifest already points at ${IMAGE}:${TAG}, nothing to commit."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add argo/deployment.yaml
          git commit -m "chore: deploy ${TAG}"
          git push origin HEAD:main
