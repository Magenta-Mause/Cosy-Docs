name: Types

# Biome does not type-check, and `vite build` only transpiles - neither notices a type error.
# This job is what makes a broken type surface on the PR instead of on main. It regenerates the
# route tree (`tsr generate`) and the MDX collections first, because both are gitignored and
# would otherwise be missing on a fresh checkout.
on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  types-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Check types
        run: bun run types:check
